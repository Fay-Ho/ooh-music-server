server:
  port: 3000

  servlet:
    encoding:
      force-response: true

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/database?useSSL=false
    username: root
    password: 12345678
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: none
